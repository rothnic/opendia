<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Structure Test - Repeated Elements</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; }
        .product-card img { width: 100%; height: 200px; background: #eee; }
        .product-card h3 { margin: 10px 0; }
        .product-card .price { color: #0066cc; font-weight: bold; }
        .product-card button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Product Catalog</h1>
    </header>

    <main>
        <div class="product-grid">
            <!-- These should be grouped as repeated elements -->
            <div class="product-card" data-product-id="1">
                <img src="#" alt="Product 1">
                <h3>Product 1</h3>
                <p class="price">$19.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="2">
                <img src="#" alt="Product 2">
                <h3>Product 2</h3>
                <p class="price">$29.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="3">
                <img src="#" alt="Product 3">
                <h3>Product 3</h3>
                <p class="price">$39.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="4">
                <img src="#" alt="Product 4">
                <h3>Product 4</h3>
                <p class="price">$49.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="5">
                <img src="#" alt="Product 5">
                <h3>Product 5</h3>
                <p class="price">$59.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="6">
                <img src="#" alt="Product 6">
                <h3>Product 6</h3>
                <p class="price">$69.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="7">
                <img src="#" alt="Product 7">
                <h3>Product 7</h3>
                <p class="price">$79.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="8">
                <img src="#" alt="Product 8">
                <h3>Product 8</h3>
                <p class="price">$89.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="9">
                <img src="#" alt="Product 9">
                <h3>Product 9</h3>
                <p class="price">$99.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card" data-product-id="10">
                <img src="#" alt="Product 10">
                <h3>Product 10</h3>
                <p class="price">$109.99</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Element Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .target-element {
            padding: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .nested {
            padding: 10px;
            background-color: #e0e0e0;
            border: 1px solid #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Element Test</h1>
        <p>This page is used to test the select_element tool.</p>

        <div id="target-1" class="target-element" data-test="value1">
            Target Element 1
        </div>

        <div id="target-2" class="target-element">
            <div class="nested" id="nested-target">
                Nested Target Element
            </div>
        </div>

        <div id="long-content">
            <p>This is a paragraph with some content.</p>
            <svg width="100" height="100">
                <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" />
            </svg>
        </div>
    </div>
</body>
</html>

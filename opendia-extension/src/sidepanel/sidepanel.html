<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenDia Page Structure</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="header">
    <h2>Page Structure</h2>
    <div class="controls">
      <button id="refresh" class="primary">Refresh</button>
      <label><input type="checkbox" id="auto-refresh"> Auto</label>
    </div>
  </div>
  <div class="options">
    <label>
      Format:
      <select id="format-select">
        <option value="regions" selected>Regions (Structured)</option>
        <option value="compact">Tree (Compact)</option>
        <option value="json">JSON</option>
      </select>
    </label>
    <label>
      Max Depth:
      <input type="number" id="max-depth" value="6" min="1" max="15" style="width: 50px;">
    </label>
    <label>
      Max Nodes:
      <input type="number" id="max-nodes" value="200" min="50" max="1000" step="50" style="width: 70px;">
    </label>
  </div>
  <div id="stats" class="stats hidden"></div>
  <pre id="content" class="content">Click Refresh to analyze page...</pre>
  <script src="../polyfill/browser-polyfill.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Structure Test - Simple Page</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        header { background: #333; color: white; padding: 20px; }
        nav { background: #555; padding: 10px; }
        nav a { color: white; margin: 0 10px; text-decoration: none; }
        main { padding: 20px; }
        aside { background: #f0f0f0; padding: 20px; }
        footer { background: #333; color: white; padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>Test Website</h1>
    </header>

    <nav role="navigation">
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>

    <main>
        <h2>Welcome</h2>
        <p>This is a simple test page with basic structure.</p>

        <section>
            <h3>Features</h3>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
        </section>

        <aside>
            <h4>Sidebar</h4>
            <p>Additional information</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2025 Test Website</p>
    </footer>
</body>
</html>
